<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Buzz Agent</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;background:#111827;color:#fff;padding:0 20px}form{background:#1f2937;padding:20px;border-radius:10px}input,textarea,select,button{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;background:#111827;color:#fff;border:1px solid #4b5563;border-radius:6px}button{background:#2563eb;border:0}.note{color:#cbd5e1}.ok{color:#86efac}.err{color:#fca5a5}</style><h1>Register one Buzz agent</h1><p class=note>The owner key is used only for this request. It is not stored. The generated agent key is encrypted on the VPS.</p><form id=f><input name=name placeholder="Agent name" required><input name=slug placeholder="Agent slug" required><input name=role placeholder="Role"><select name=harness><option>goose</option><option>claude</option></select><input name=relayUrl placeholder="Relay WebSocket address" required><textarea name=prompt placeholder="System prompt"></textarea><input name=ownerNsec type=password autocomplete=off placeholder="Owner private key (nsec...)" required><button>Register agent</button><p id=m></p></form><script>f.onsubmit=async e=>{e.preventDefault();m.className='';m.textContent='Registering...';const b=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/register-agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),x=await r.json();if(!r.ok)throw Error(x.error||'registration failed');f.ownerNsec.value='';m.className='ok';m.textContent='Registered '+x.agent.name+' as '+x.agent.buzzPubkey}catch(err){f.ownerNsec.value='';m.className='err';m.textContent=err.message}}</script>
