<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buzz Agent Manager</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;background:#111827;color:#fff;padding:0 20px}section,article{background:#1f2937;padding:18px;margin:14px 0;border-radius:10px}input,textarea,select,button{padding:9px;margin:4px;background:#111827;color:#fff;border:1px solid #4b5563;border-radius:6px}button{background:#2563eb;border:0}.agent{display:grid;grid-template-columns:1fr 1fr;gap:6px}.agent textarea{grid-column:1/-1;min-height:70px}pre{white-space:pre-wrap;background:#0b1020;padding:12px;border-radius:6px}</style><h1>Buzz Agent Manager</h1><section id="login"><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Sign in</button></section><main id="app" hidden><button onclick="load()">Refresh</button><button onclick="sync()">Save and sync</button><h2>Agents</h2><div id="agents"></div><button onclick="add()">Add agent</button><h2>OpenRouter</h2><input id="key" type="password" placeholder="Provider key"><button onclick="saveKey()">Save key</button><h2>Containers</h2><pre id="containers"></pre></main><script>const $=x=>document.getElementById(x),api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()});async function login(){await api('/api/login',{method:'POST',body:JSON.stringify({password:$('pw').value})});$('login').hidden=true;$('app').hidden=false;load()}async function load(){const[a,c]=await Promise.all([api('/api/agents'),api('/api/containers')]);$('agents').innerHTML=a.map(x=>`<article class=agent data-id=${x.id}><input data-k=name value="${x.name}"><input data-k=slug value="${x.slug}"><input data-k=role value="${x.role}"><select data-k=harness><option ${x.harness==='goose'?'selected':''}>goose</option><option ${x.harness==='claude'?'selected':''}>claude</option></select><textarea data-k=prompt>${x.prompt}</textarea><button onclick="save('${x.id}')">Save</button><button onclick="removeA('${x.id}')">Remove</button></article>`).join('');$('containers').textContent=JSON.stringify(c,null,2)}function fields(e){const o={};e.querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value);return o}async function save(id){const e=document.querySelector(`[data-id="${id}"]`);await api('/api/agents/'+id,{method:'PUT',body:JSON.stringify(fields(e))});load()}async function add(){await api('/api/agents',{method:'POST',body:JSON.stringify({name:'New agent',slug:'new-agent',harness:'goose'})});load()}async function removeA(id){if(confirm('Remove this configuration?')){await api('/api/agents/'+id,{method:'DELETE'});load()}}async function saveKey(){if($('key').value){await api('/api/providers/openrouter',{method:'POST',body:JSON.stringify({key:$('key').value})});$('key').value=''}}async function sync(){await api('/api/sync',{method:'POST'});alert('Configuration saved; Buzz identity registration remains separate.')}api('/api/session').then(()=>{ $('login').hidden=true;$('app').hidden=false;load()}).catch(()=>{});</script>
